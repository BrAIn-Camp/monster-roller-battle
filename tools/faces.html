<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Portrait sheet</title>
<style>
  body { margin: 16px; background: #2b2540; color: #fff; font: 700 14px "Trebuchet MS", "Segoe UI", sans-serif; }
  canvas { display: block; margin-top: 12px; max-width: 100%; background: repeating-conic-gradient(#3a3355 0% 25%, #2b2540 0% 50%) 0 0 / 28px 28px; }
  a { color: #ffe169; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<!-- Draws models/stadium/faces.png: one portrait of every model, 16 across, 112 px each, in dex order. The game cuts
     its portraits (dex, HUD, results) from this sheet, so it never has to load a model just to show its face.
     Run it again if the models change:   python tools/serve.py   then open   http://127.0.0.1:8417/tools/faces.html
     With the dev server it saves the sheet itself; otherwise use the link. -->
<div id="say">Loading the models...</div>
<script type="module">
import * as THREE from 'three';
import { stadiumMeta, loadStadium, makeStadiumInstance, stadiumBase } from '../critters/stadium.js';

// as many as the model set in use has: 151 for the Stadium set, 493 for the Battle Revolution one
const meta = await stadiumMeta();
const PX = 112, COLS = 16, N = meta ? Math.max(...Object.keys(meta).map(Number)) : 151, say = document.getElementById('say');
const set = /\/models\/pbr\/$/.test(stadiumBase()) ? 'pbr' : 'stadium';
const r = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
r.setSize(PX, PX);
const sc = new THREE.Scene(), cam = new THREE.PerspectiveCamera(30, 1, 0.05, 80);
sc.add(new THREE.HemisphereLight(0xffffff, 0x8899aa, 2.2));
{ const dl = new THREE.DirectionalLight(0xffffff, 1.6); dl.position.set(2, 3, 4); sc.add(dl); }
const sheet = document.createElement('canvas'), cx = sheet.getContext('2d');
sheet.width = COLS * PX; sheet.height = Math.ceil(N / COLS) * PX;

function shoot(loaded, dex) {
  const inst = makeStadiumInstance(loaded);
  sc.add(inst.root); inst.update(0);
  // (measured on the posed model, bone by bone: the plain box of a skinned mesh is its rest pose and can be far too big)
  inst.root.updateMatrixWorld(true);
  const b = new THREE.Box3().setFromObject(inst.root, true), c = b.getCenter(new THREE.Vector3()), sz = b.getSize(new THREE.Vector3()), s = Math.max(sz.x, sz.y, sz.z * 0.8);
  cam.position.set(c.x + s * 0.85, c.y + s * 0.45, c.z + s * 1.7); cam.lookAt(c);
  r.render(sc, cam);
  const i = dex - 1, x = (i % COLS) * PX, y = Math.floor(i / COLS) * PX;
  cx.clearRect(x, y, PX, PX); cx.drawImage(r.domElement, x, y);
  sc.remove(inst.root); inst.dispose();
}

if (!meta) say.textContent = 'No models here (models/pbr/meta.json and models/stadium/meta.json are both missing).';
else {
  // a few dozen at a time: every model at once is 493 files on the go and a lot of memory
  const got = [];
  for (let from = 1; from <= N; from += 40) {
    const batch = [];
    for (let d = from; d < from + 40 && d <= N; d++) batch.push(loadStadium(d).then((l) => ({ d, l })));
    for (const q of await Promise.all(batch)) if (q.l) got.push(q);
    say.textContent = `Loading the models... ${Math.min(N, from + 39)} of ${N}`;
  }
  // twice, a moment apart: a texture can still be on its way to the graphics card the first time, and come out black
  for (const q of got) shoot(q.l, q.d);
  await new Promise((res) => setTimeout(res, 1500));
  for (const q of got) shoot(q.l, q.d);
  document.body.appendChild(sheet);
  const blob = await new Promise((res) => sheet.toBlob(res, 'image/png'));
  const link = `<a download="faces.png" href="${URL.createObjectURL(blob)}">Save it as models/${set}/faces.png</a>`;
  let saved = '';
  try { const res = await fetch('/tools/save-faces' + (set === 'pbr' ? '?set=pbr' : ''), { method: 'POST', body: blob }); if (res.ok) saved = `Saved to models/${set}/faces.png. `; } catch (e) { /* not the dev server */ }
  say.innerHTML = `${got.length} of ${N} portraits, ${Math.round(blob.size / 1024)} KB. ${saved || link}`;
  window.__faces = { n: got.length, bytes: blob.size, saved: !!saved };
}
</script>
</body>
</html>
